<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block{
            display: block;
            width: 100px;
            height: 100px;
            background-color: red;
        }
        /* 行内元素宽高不可变 */
        .inline{
            display: inline;
            width: 400px;
            height: 400px;
            background-color: blue;
        }
        .inline-block{
            display: inline-block;
            width: 200px;
            height: 200px;
            background-color: green;
        }
        .div-inline{
            display: inline;
            width: 100px;
            height: 100px;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1 style="font: bolder 50px 'KaiTi'; color: red;">这是一个一级标题</h1>
    <p style="line-height: 100px">
        这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本这是一个长文本
    </p>
    <div class="block">这是一个块元素</div>
    <span class="inline">这是一个行内元素</span>
    <image src="9662.jpg_wh860.jpg" alt="该图片无法显示" class="inline-block">
    </image>
    <h2>display</h2>
    <div class="div-inline">这是一个div转inline案例</div>
</body>
</html>
