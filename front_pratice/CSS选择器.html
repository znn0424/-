<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .my-class {
            color: blue;
            font-size: 24px;
        }
        #my-id {
            color: red;
            font-size: 30px;
        }
        * {
            font-family:'KaiTi';
            font-weight: bold;
        }
        /* 也可以用.father > p */
        .father .son {
            color: green;
            font-size: 20px;
        }
        .father .grandson {
            color: purple;
            font-size: 18px;
        }
        h3 + p {
            color: orange;
            font-size: 16px;
        }
        #element:hover {
            color: pink;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1 class="my-class">这是一个类选择器</>
    <h1 >这是一个类选择器</h>
    <h2 id="my-id">这是一个ID选择器</h2>
    <h2>这是一个ID选择器</h2>
    <div class="father">
        <p class="son">这是一个子元素选择器</p>
        <div>
            <p class="grandson">这是一个后代选择器</p>
        </div>
    </div>
    <p>这是一个普通标签</p>
    <h3>这是一个相邻兄弟选择器示例</h3>
    <p>这是一另一个普通标签</p>
    <h3 id="element">这是一个伪类选择器</h3>
</body>
</html>
